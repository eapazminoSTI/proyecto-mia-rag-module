x-rag-env: &rag-env
  N8N_URL: ${N8N_URL:-http://host.docker.internal:5678}
  N8N_API_KEY: ${N8N_API_KEY:?N8N_API_KEY es requerida — ver README.md sección 6}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY es requerida — ver README.md sección 6}
  DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@db:5432/${POSTGRES_DB:-rag}
  RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-text-embedding-3-small}
  RAG_EMBED_DIM: ${RAG_EMBED_DIM:-1536}
  RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./rag/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *rag-env
    ports:
      - "8501:8501"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *rag-env
    ports:
      - "8000:8000"
    entrypoint: ["uvicorn", "rag.api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      # Sobrescribe el HEALTHCHECK del Dockerfile (apunta a Streamlit en :8501)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  ingest:
    build: .
    profiles: ["ingest"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *rag-env
    entrypoint: ["python", "-m", "rag.ingest"]

volumes:
  pgdata:
