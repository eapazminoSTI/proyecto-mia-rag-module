[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latinnova-rag"
version = "0.1.0"
description = "Módulo RAG (retrieval semántico) sobre leads del pipeline Latinnova MIA"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-llms-openai>=0.2.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-storage-docstore-postgres>=0.2.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
agent = [
    "langgraph>=1.2.16",
    "langchain-openai>=1.7.2",
]

# Descubrimiento automático: el Dockerfile solo copia rag/, así que una lista fija
# con "agent" rompería `pip install -e .` dentro de la imagen.
[tool.setuptools.packages.find]
include = ["rag*", "agent*"]
